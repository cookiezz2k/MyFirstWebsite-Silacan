  <link rel="stylesheet" href="style.css">
  <style>
    /* Testimonial gallery (self-contained so it won't clash with style.css) */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-top: 32px;
    }
    .shot {
      margin: 0;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .shot:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    .shot img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      object-fit: cover;
    }
    .shot figcaption {
      padding: 12px 16px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
